name: ai_accessibility_assistant
description: مساعد ذكي صوتي لتمكين ذوي الإعاقة الحركية من إدارة أنظمة المحاسبة
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  record: ^6.2.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  intl: ^0.20.1
  open_filex: ^4.7.0
  pdf: ^3.12.0
  flutter_tts: ^4.2.5
  wakelock_plus: ^1.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/IBMPlexSansArabic-Regular.ttf
    - assets/fonts/Roboto-Regular.ttf
    - assets/sounds/

  fonts:
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
